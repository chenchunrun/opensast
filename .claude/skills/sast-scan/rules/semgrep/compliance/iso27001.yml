# ISO 27001:2022 Annex A. AST patterns are grouped by compatible language syntax.

rules:
  - id: iso27001.a8-8-vulnerable-dependency
    languages: [generic]
    severity: WARNING
    message: Potentially vulnerable dependency version. ISO 27001 A.8.8 requires vulnerability management.
    metadata:
      category: compliance
      cwe: [CWE-1104]
      owasp: ['A06:2021-Vulnerable and Outdated Components']
      confidence: MEDIUM
      technology: [python, javascript, typescript]
      compliance: ['ISO 27001:2022 A.8.8']
    pattern-either:
      - pattern-regex: '"lodash"\s*:\s*"[\^~]?[0-4]\.'
      - pattern-regex: '"express"\s*:\s*"[\^~]?[0-3]\.'
      - pattern-regex: flask\s*=\s*"[\^~]?[01]\.
      - pattern-regex: Django\s*=\s*"[\^~]?[012]\.
  - id: iso27001.a8-9-production-debug
    languages: [python]
    severity: WARNING
    message: Debug mode or detailed error reporting enabled. ISO 27001 A.8.9 requires secure configurations.
    metadata:
      category: compliance
      cwe: [CWE-215]
      owasp: ['A05:2021-Security Misconfiguration']
      confidence: HIGH
      technology: [python]
      compliance: ['ISO 27001:2022 A.8.9']
    pattern-either:
      - pattern: DEBUG = True
      - pattern: app.run(..., debug=True, ...)
  - id: iso27001.a8-9-production-debug-js
    languages: [javascript, typescript]
    severity: WARNING
    message: Debug mode or detailed error reporting enabled. ISO 27001 A.8.9 requires secure configurations.
    metadata:
      category: compliance
      cwe: [CWE-215]
      owasp: ['A05:2021-Security Misconfiguration']
      confidence: HIGH
      technology: [javascript, typescript]
      compliance: ['ISO 27001:2022 A.8.9']
    pattern: '{debug: true, ...}'
  - id: iso27001.a8-9-production-debug-php
    languages: [php]
    severity: WARNING
    message: Debug mode or detailed error reporting enabled. ISO 27001 A.8.9 requires secure configurations.
    metadata:
      category: compliance
      cwe: [CWE-215]
      owasp: ['A05:2021-Security Misconfiguration']
      confidence: HIGH
      technology: [php]
      compliance: ['ISO 27001:2022 A.8.9']
    pattern-either:
      - pattern: ini_set("display_errors", "1")
      - pattern: define("APP_DEBUG", true)
  - id: iso27001.a8-9-production-debug-ruby
    languages: [ruby]
    severity: WARNING
    message: Debug mode or detailed error reporting enabled. ISO 27001 A.8.9 requires secure configurations.
    metadata:
      category: compliance
      cwe: [CWE-215]
      owasp: ['A05:2021-Security Misconfiguration']
      confidence: HIGH
      technology: [ruby]
      compliance: ['ISO 27001:2022 A.8.9']
    pattern: $CFG.consider_all_requests_local = true
  - id: iso27001.a8-9-production-debug-jvm-dotnet
    languages: [java, csharp]
    severity: WARNING
    message: Debug mode or detailed error reporting enabled. ISO 27001 A.8.9 requires secure configurations.
    metadata:
      category: compliance
      cwe: [CWE-215]
      owasp: ['A05:2021-Security Misconfiguration']
      confidence: HIGH
      technology: [java, csharp]
      compliance: ['ISO 27001:2022 A.8.9']
    pattern: $CFG.debug = true;
  - id: iso27001.a8-12-hardcoded-secrets
    languages: [python, javascript, typescript, java, php, ruby, go, csharp]
    severity: ERROR
    message: Hardcoded credential detected. ISO 27001 A.8.12 requires data leakage prevention including credential protection.
    metadata:
      category: compliance
      cwe: [CWE-798]
      owasp: ['A07:2021-Identification and Authentication Failures']
      confidence: HIGH
      technology: [python, javascript, typescript, java, php, ruby, go, csharp]
      compliance: ['ISO 27001:2022 A.8.12']
    pattern-regex: (?i)(?:password|secret|api_key|apikey|token|auth_key)\s*[:=]\s*["'][\S]{8,}["']
  - id: iso27001.a8-26-missing-input-validation
    languages: [python, javascript, typescript, java, php]
    severity: WARNING
    message: User input passed directly to dangerous function. ISO 27001 A.8.26 requires input validation.
    metadata:
      category: compliance
      cwe: [CWE-20]
      owasp: ['A03:2021-Injection']
      confidence: MEDIUM
      technology: [python, javascript, typescript, java, php]
      compliance: ['ISO 27001:2022 A.8.26']
    patterns:
      - pattern-either:
          - pattern: |
              $CURSOR.execute("..." + $VAR)
          - pattern: |
              exec($VAR)
          - pattern: |
              eval($VAR)
      - pattern-not: |
          $CURSOR.execute("...", ...)
  - id: iso27001.a8-3-open-cors
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS configured with wildcard origin. ISO 27001 A.8.3 restricts information access.
    metadata:
      category: compliance
      cwe: [CWE-942]
      owasp: ['A05:2021-Security Misconfiguration']
      confidence: MEDIUM
      technology: [javascript, typescript]
      compliance: ['ISO 27001:2022 A.8.3']
    pattern-regex: Access-Control-Allow-Origin["'\s]*:["'\s]*\*
